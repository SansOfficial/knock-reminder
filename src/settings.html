<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' file: data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>敲屏提醒</title>
  <link rel="stylesheet" href="settings.css">
</head>
<body>
  <header>
    <div class="brand">
      <span class="logo">👊</span>
      <div>
        <h1>敲屏提醒</h1>
        <p class="sub">到点了,它会来敲你的屏幕</p>
      </div>
    </div>
    <label class="pause">
      <span>暂停所有提醒</span>
      <span class="switch"><input type="checkbox" id="paused"><i></i></span>
    </label>
  </header>

  <main>
    <section>
      <div class="section-head">
        <h2>提醒事项</h2>
        <button class="primary" id="add">+ 新建提醒</button>
      </div>
      <div id="list"></div>
    </section>

    <section>
      <div class="section-head"><h2>通用设置</h2></div>
      <div class="settings">
        <div class="row">
          <div class="label">活跃时段<small>间隔型提醒只在这个时段内敲</small></div>
          <div class="ctrl"><input type="time" data-key="activeStart"> 至 <input type="time" data-key="activeEnd"></div>
        </div>
        <div class="row">
          <div class="label">只在工作日提醒</div>
          <div class="ctrl"><span class="switch"><input type="checkbox" data-key="weekdaysOnly"><i></i></span></div>
        </div>
        <div class="row">
          <div class="label">敲击声音</div>
          <div class="ctrl">
            <span class="switch"><input type="checkbox" data-key="sound"><i></i></span>
            <input type="range" min="0" max="1" step="0.05" data-key="volume">
          </div>
        </div>
        <div class="row">
          <div class="label">提醒时压暗背景<small>更醒目</small></div>
          <div class="ctrl"><span class="switch"><input type="checkbox" data-key="dim"><i></i></span></div>
        </div>
        <div class="row">
          <div class="label">形象大小<small>调小更精致清晰</small></div>
          <div class="ctrl">
            <input type="range" min="0.3" max="1.2" step="0.05" data-key="scale">
            <span class="range-val" id="scale-val">55%</span>
          </div>
        </div>
        <div class="row">
          <div class="label">自动收起<small>0 表示一直敲到你点掉为止</small></div>
          <div class="ctrl"><input type="number" min="0" max="3600" data-key="autoCloseSec"> 秒</div>
        </div>
        <div class="row">
          <div class="label">"稍后再敲"间隔</div>
          <div class="ctrl"><input type="number" min="1" max="120" data-key="snoozeMin"> 分钟</div>
        </div>
        <div class="row">
          <div class="label">开机自动启动</div>
          <div class="ctrl"><span class="switch"><input type="checkbox" data-key="openAtLogin"><i></i></span></div>
        </div>
      </div>
      <p class="hint">关掉这个窗口后程序仍在后台运行,可从菜单栏 / 系统托盘的橙色小圆点重新打开或退出。</p>
    </section>
  </main>

  <dialog id="editor">
    <form method="dialog" id="form">
      <h2 id="editor-title">新建提醒</h2>

      <div class="presets" id="presets"></div>

      <label class="field">
        <span>名称</span>
        <input id="f-title" maxlength="30" placeholder="比如:喝水" required>
      </label>
      <label class="field">
        <span>提醒语</span>
        <textarea id="f-message" maxlength="200" rows="2" placeholder="形象敲屏时说的话"></textarea>
      </label>

      <div class="field">
        <span>形象</span>
        <div class="chars" id="f-chars"></div>
      </div>

      <div class="field">
        <span>提醒方式</span>
        <div class="modes">
          <label><input type="radio" name="mode" value="interval"> 每隔一段时间</label>
          <label><input type="radio" name="mode" value="times"> 每天固定时间</label>
        </div>
        <div id="mode-interval" class="mode-body">
          每 <input type="number" id="f-interval" min="1" max="1440"> 分钟
          <span class="quick" id="quick"></span>
        </div>
        <div id="mode-times" class="mode-body">
          <div class="times" id="f-times"></div>
          <input type="time" id="f-time-new"> <button type="button" id="f-time-add">添加</button>
        </div>
      </div>

      <div class="dialog-actions">
        <button type="button" class="danger" id="f-delete">删除</button>
        <span class="spacer"></span>
        <button type="button" id="f-test">试一下</button>
        <button type="button" id="f-cancel">取消</button>
        <button type="submit" class="primary">保存</button>
      </div>
    </form>
  </dialog>

  <script src="settings.js"></script>
</body>
</html>
